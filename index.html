<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aashu App Store</title>

<style>
/* =========================================================
   AASHU APP STORE — LIQUID GLASS WHITE UI
   Single-file version
========================================================= */

:root{
    --blue:#1677ff;
    --blue2:#69b7ff;
    --text:#14213d;
    --muted:#71809b;
    --border:rgba(255,255,255,.85);
    --glass:rgba(255,255,255,.70);
    --glass2:rgba(255,255,255,.48);
    --shadow:0 15px 45px rgba(48,91,150,.12);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color:var(--text);

    min-height:100vh;

    background:
        radial-gradient(circle at 10% 5%, #dff0ff 0, transparent 28%),
        radial-gradient(circle at 90% 10%, #e9e3ff 0, transparent 30%),
        radial-gradient(circle at 50% 90%, #dff7ff 0, transparent 28%),
        #f5f9ff;
}

/* Prevent accidental horizontal glitch */
body{
    overflow-x:hidden;
}

/* =========================================================
   BACKGROUND LIQUID ORBS
========================================================= */

.background-orb{
    position:fixed;
    pointer-events:none;
    z-index:-1;
    border-radius:50%;
    filter:blur(1px);
    opacity:.65;
}

.orb1{
    width:280px;
    height:280px;
    left:-100px;
    top:180px;
    background:
        radial-gradient(circle at 35% 30%,
        rgba(255,255,255,.95),
        rgba(119,190,255,.25),
        transparent 70%);
}

.orb2{
    width:350px;
    height:350px;
    right:-140px;
    top:450px;
    background:
        radial-gradient(circle at 40% 40%,
        rgba(255,255,255,.9),
        rgba(160,130,255,.25),
        transparent 70%);
}

/* =========================================================
   GLASS
========================================================= */

.glass{
    background:var(--glass);
    border:1px solid var(--border);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.95),
        inset 0 -1px 0 rgba(255,255,255,.35),
        var(--shadow);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
}

/* =========================================================
   HEADER
========================================================= */

header{
    width:calc(100% - 40px);
    max-width:1320px;
    height:76px;

    margin:20px auto;

    padding:0 22px;

    border-radius:24px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    position:sticky;
    top:16px;
    z-index:1000;

    background:rgba(255,255,255,.72);
    border:1px solid rgba(255,255,255,.9);

    box-shadow:
        0 12px 35px rgba(50,85,130,.10),
        inset 0 1px 0 white;

    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;

    font-size:23px;
    font-weight:800;
    letter-spacing:-.5px;
}

.logo-icon{
    width:40px;
    height:40px;

    display:grid;
    place-items:center;

    border-radius:13px;

    color:white;
    font-size:21px;

    background:
        linear-gradient(145deg,#2f8bff,#1265dc);

    box-shadow:
        0 8px 18px rgba(22,119,255,.25),
        inset 0 1px 1px rgba(255,255,255,.7);
}

.logo span{
    color:var(--blue);
}

.logo strong{
    color:#17233c;
}

nav{
    display:flex;
    align-items:center;
    gap:8px;
}

nav a{
    color:#46536d;
    text-decoration:none;

    padding:11px 17px;
    border-radius:16px;

    font-size:14px;
    font-weight:600;

    transition:.25s ease;
}

nav a:hover{
    color:var(--blue);
    background:rgba(255,255,255,.8);
}

.menu-btn{
    display:none;

    width:42px;
    height:42px;

    border:1px solid rgba(255,255,255,.9);
    border-radius:14px;

    background:rgba(255,255,255,.65);

    font-size:21px;
    cursor:pointer;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    width:calc(100% - 40px);
    max-width:1320px;

    min-height:455px;

    margin:20px auto;

    padding:65px 40px;

    border-radius:30px;

    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.92),
            rgba(238,247,255,.72)
        );

    border:1px solid rgba(255,255,255,.95);

    box-shadow:
        0 25px 70px rgba(53,98,153,.12),
        inset 0 1px 0 white;

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    display:flex;
    align-items:center;
}

.hero-content{
    width:58%;
    position:relative;
    z-index:5;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:9px 15px;

    border-radius:30px;

    color:#176bdc;
    font-size:13px;
    font-weight:700;

    background:rgba(255,255,255,.7);
    border:1px solid rgba(122,181,255,.25);

    box-shadow:
        inset 0 1px 0 white,
        0 6px 18px rgba(66,137,216,.08);
}

.hero h1{
    margin-top:20px;

    font-size:clamp(42px,5vw,66px);
    line-height:1.04;
    letter-spacing:-2.5px;
}

.hero h1 .blue{
    color:var(--blue);
}

.hero p{
    max-width:590px;

    margin-top:20px;

    color:#61708c;
    font-size:18px;
    line-height:1.7;
}

/* Search */

.search-box{
    width:min(610px,100%);

    margin-top:28px;

    height:58px;

    display:flex;
    align-items:center;

    padding:5px;

    background:rgba(255,255,255,.8);

    border:1px solid rgba(255,255,255,.95);

    border-radius:18px;

    box-shadow:
        0 12px 30px rgba(52,100,160,.10),
        inset 0 1px 0 white;
}

.search-icon{
    width:48px;

    text-align:center;

    color:#6880a5;
    font-size:21px;
}

.search-box input{
    flex:1;

    height:100%;

    border:0;
    outline:0;

    background:transparent;

    color:var(--text);

    font-size:15px;
}

.search-box input::placeholder{
    color:#9aa7bb;
}

.search-box button{
    height:46px;

    padding:0 22px;

    border:0;
    border-radius:14px;

    background:linear-gradient(145deg,#2788ff,#1268e5);

    color:white;

    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 8px 18px rgba(22,119,255,.25),
        inset 0 1px 0 rgba(255,255,255,.45);

    transition:.2s;
}

.search-box button:hover{
    transform:translateY(-1px);
}

/* =========================================================
   HERO LIQUID SHAPES
========================================================= */

.liquid-area{
    position:absolute;
    right:-20px;
    top:-20px;

    width:48%;
    height:110%;

    overflow:hidden;
}

.liquid{
    position:absolute;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.92),
            rgba(173,218,255,.40)
        );

    border:1px solid rgba(255,255,255,.9);

    box-shadow:
        inset 15px 15px 30px rgba(255,255,255,.7),
        inset -10px -12px 30px rgba(91,161,245,.16),
        0 15px 40px rgba(50,120,210,.10);

    backdrop-filter:blur(5px);
}

.liquid.one{
    width:250px;
    height:250px;
    right:100px;
    top:15px;
}

.liquid.two{
    width:270px;
    height:190px;
    right:-10px;
    top:120px;
    transform:rotate(25deg);
}

.liquid.three{
    width:230px;
    height:230px;
    right:90px;
    bottom:-50px;
}

.liquid.small{
    width:70px;
    height:70px;
    right:310px;
    bottom:70px;
}

/* =========================================================
   STATS
========================================================= */

.stats{
    display:flex;
    gap:16px;
    margin-top:25px;
}

.stat{
    display:flex;
    align-items:center;
    gap:11px;

    padding:12px 18px;

    border-radius:18px;

    background:rgba(255,255,255,.68);

    border:1px solid rgba(255,255,255,.9);

    box-shadow:
        inset 0 1px 0 white,
        0 8px 25px rgba(54,100,150,.07);
}

.stat-icon{
    width:38px;
    height:38px;

    display:grid;
    place-items:center;

    border-radius:12px;

    background:linear-gradient(145deg,#4ca0ff,#1677ff);

    color:white;
}

.stat strong{
    display:block;
    font-size:15px;
}

.stat span{
    color:#7a879d;
    font-size:12px;
}

/* =========================================================
   MAIN
========================================================= */

.container{
    width:calc(100% - 40px);
    max-width:1320px;

    margin:25px auto;
}

.section{
    padding:24px;

    border-radius:28px;

    margin-bottom:22px;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:20px;
}

.section-title{
    font-size:25px;
    letter-spacing:-.5px;
}

.section-title::before{
    content:"";
    display:inline-block;

    width:5px;
    height:25px;

    margin-right:10px;

    vertical-align:-4px;

    border-radius:10px;

    background:var(--blue);
}

.view-all{
    color:var(--blue);
    text-decoration:none;
    font-size:14px;
    font-weight:700;
}

/* =========================================================
   CATEGORIES
========================================================= */

.category-bar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.category{
    display:flex;
    align-items:center;
    gap:8px;

    padding:12px 18px;

    border-radius:18px;

    background:rgba(255,255,255,.62);

    border:1px solid rgba(255,255,255,.9);

    color:#50607b;

    font-weight:600;
    font-size:14px;

    cursor:pointer;

    box-shadow:
        inset 0 1px 0 white,
        0 5px 15px rgba(50,90,140,.05);

    transition:.2s;
}

.category:hover,
.category.active{
    color:var(--blue);

    background:rgba(255,255,255,.9);

    border-color:rgba(100,174,255,.35);

    box-shadow:
        0 7px 20px rgba(22,119,255,.10);
}

/* =========================================================
   APP GRID
========================================================= */

.apps{
    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:18px;
}

.app-card{
    padding:20px;

    border-radius:23px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.84),
            rgba(255,255,255,.56)
        );

    border:1px solid rgba(255,255,255,.95);

    box-shadow:
        inset 0 1px 0 white,
        0 12px 30px rgba(53,98,153,.09);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.app-card:hover{
    transform:translateY(-5px);

    box-shadow:
        inset 0 1px 0 white,
        0 20px 40px rgba(53,98,153,.14);
}

.app-top{
    display:flex;
    gap:14px;
    align-items:flex-start;
}

.app-icon{
    width:70px;
    height:70px;

    flex:none;

    display:grid;
    place-items:center;

    border-radius:19px;

    font-size:31px;

    color:white;

    background:
        linear-gradient(145deg,#62caff,#166ee9);

    box-shadow:
        0 10px 22px rgba(28,121,235,.18),
        inset 0 1px 0 rgba(255,255,255,.7);
}

.app-info{
    flex:1;
    min-width:0;
}

.app-name{
    font-size:17px;
    font-weight:800;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.app-category{
    margin-top:5px;

    color:var(--blue);

    font-size:13px;
    font-weight:600;
}

.rating{
    flex:none;

    padding:6px 9px;

    border-radius:12px;

    background:rgba(255,255,255,.75);

    border:1px solid rgba(220,230,242,.7);

    font-size:12px;
    font-weight:700;
}

.app-description{
    margin-top:15px;

    min-height:42px;

    color:#6c7991;

    font-size:13px;
    line-height:1.6;
}

.app-meta{
    display:flex;
    justify-content:space-between;

    margin-top:15px;

    color:#8794aa;

    font-size:12px;
}

.app-actions{
    display:flex;
    gap:8px;

    margin-top:17px;
}

.download-btn{
    flex:1;

    border:1px solid rgba(255,255,255,.9);

    border-radius:14px;

    padding:11px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.95),
            rgba(237,247,255,.75)
        );

    color:var(--blue);

    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 5px 15px rgba(48,100,160,.07),
        inset 0 1px 0 white;
}

.download-btn:hover{
    background:white;
}

.favorite{
    width:45px;

    border:1px solid rgba(255,255,255,.9);

    border-radius:14px;

    background:rgba(255,255,255,.65);

    cursor:pointer;

    font-size:18px;

    color:#61728f;
}

.favorite:hover{
    color:#ff5277;
}

/* =========================================================
   FEATURES
========================================================= */

.features{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:0;
}

.feature{
    padding:10px 25px;

    display:flex;
    align-items:center;
    gap:14px;

    border-right:1px solid rgba(150,170,200,.25);
}

.feature:last-child{
    border-right:0;
}

.feature-icon{
    width:46px;
    height:46px;

    flex:none;

    display:grid;
    place-items:center;

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.95),
            rgba(224,240,255,.75)
        );

    color:var(--blue);

    font-size:21px;

    box-shadow:
        0 7px 18px rgba(50,100,160,.08);
}

.feature h4{
    font-size:14px;
}

.feature p{
    margin-top:4px;

    color:#7c899e;

    font-size:12px;
    line-height:1.4;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
    width:calc(100% - 40px);
    max-width:1320px;

    margin:25px auto 20px;

    padding:30px;

    border-radius:28px;

    display:grid;

    grid-template-columns:2fr 1fr 1fr 1fr;

    gap:25px;
}

.footer-logo{
    font-size:19px;
    font-weight:800;
}

.footer-logo span{
    color:var(--blue);
}

footer p{
    color:#7a879d;
    font-size:13px;
    line-height:1.6;
    margin-top:9px;
}

footer h4{
    margin-bottom:10px;
    font-size:14px;
}

footer a{
    display:block;

    color:#71809a;

    text-decoration:none;

    font-size:13px;

    margin:7px 0;
}

footer a:hover{
    color:var(--blue);
}

.copyright{
    grid-column:1/-1;

    padding-top:18px;

    border-top:1px solid rgba(150,170,200,.25);

    text-align:center;

    color:#8b98ac;

    font-size:12px;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(20,35,60,.22);

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    z-index:3000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(500px,100%);

    padding:28px;

    border-radius:27px;

    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.94),
            rgba(240,248,255,.88)
        );

    border:1px solid white;

    box-shadow:
        0 30px 80px rgba(20,50,90,.20),
        inset 0 1px 0 white;

    animation:modalIn .22s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:scale(.96) translateY(10px);
    }

    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.close{
    position:absolute;

    right:18px;
    top:16px;

    width:38px;
    height:38px;

    border:0;
    border-radius:12px;

    background:rgba(255,255,255,.8);

    cursor:pointer;

    font-size:22px;

    color:#66758e;
}

.modal-icon{
    width:80px;
    height:80px;

    display:grid;
    place-items:center;

    border-radius:21px;

    color:white;
    font-size:34px;

    background:linear-gradient(145deg,#62caff,#166ee9);

    margin-bottom:18px;
}

.modal-box h2{
    font-size:25px;
}

.modal-box p{
    margin-top:10px;

    color:#6f7d94;

    font-size:14px;
    line-height:1.6;
}

.modal-download{
    display:block;

    margin-top:20px;

    padding:13px;

    text-align:center;

    text-decoration:none;

    border-radius:14px;

    color:white;

    background:linear-gradient(145deg,#2788ff,#1268e5);

    font-weight:700;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:1000px){

    .apps{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .features{
        grid-template-columns:
            repeat(2,1fr);
    }

    .feature:nth-child(2){
        border-right:0;
    }

    footer{
        grid-template-columns:
            repeat(2,1fr);
    }

    .hero-content{
        width:70%;
    }

    .liquid-area{
        opacity:.65;
    }
}

@media(max-width:700px){

    header{
        width:calc(100% - 24px);
        height:65px;

        margin:12px auto;

        top:8px;

        padding:0 14px;

        border-radius:20px;
    }

    .logo{
        font-size:18px;
    }

    .logo-icon{
        width:36px;
        height:36px;
        font-size:18px;
    }

    nav{
        display:none;
    }

    .menu-btn{
        display:block;
    }

    .hero{
        width:calc(100% - 24px);

        min-height:560px;

        margin:12px auto;

        padding:42px 23px;

        border-radius:25px;

        align-items:flex-start;
    }

    .hero-content{
        width:100%;
        z-index:10;
    }

    .hero h1{
        font-size:40px;
        letter-spacing:-1.7px;
    }

    .hero p{
        font-size:15px;
    }

    .liquid-area{
        width:100%;
        height:45%;

        top:auto;
        bottom:-20px;
        right:0;

        opacity:.55;
    }

    .liquid.one{
        width:180px;
        height:180px;

        right:70px;
        top:30px;
    }

    .liquid.two{
        width:190px;
        height:130px;

        right:-30px;
        top:100px;
    }

    .liquid.three{
        width:160px;
        height:160px;

        right:60px;
        bottom:-70px;
    }

    .search-box{
        height:55px;
    }

    .search-box button{
        padding:0 15px;
    }

    .stats{
        flex-direction:column;
        width:max-content;
        max-width:100%;
    }

    .stat{
        padding:9px 13px;
    }

    .container{
        width:calc(100% - 24px);
    }

    .section{
        padding:18px;

        border-radius:23px;
    }

    .apps{
        grid-template-columns:1fr;
    }

    .features{
        grid-template-columns:1fr;
    }

    .feature{
        border-right:0;
        border-bottom:1px solid rgba(150,170,200,.2);

        padding:14px 5px;
    }

    .feature:last-child{
        border-bottom:0;
    }

    footer{
        width:calc(100% - 24px);

        grid-template-columns:1fr 1fr;

        padding:22px;

        border-radius:23px;
    }

    .footer-main{
        grid-column:1/-1;
    }
}

@media(max-width:430px){

    .hero h1{
        font-size:35px;
    }

    .search-box button{
        font-size:0;
        width:48px;
        padding:0;
    }

    .search-box button::after{
        content:"⌕";
        font-size:21px;
    }

    .section-head{
        align-items:flex-start;
    }

    .view-all{
        font-size:12px;
    }

    footer{
        grid-template-columns:1fr;
    }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *{
        scroll-behavior:auto !important;
        transition:none !important;
        animation:none !important;
    }
}
</style>
</head>


<body>

<div class="background-orb orb1"></div>
<div class="background-orb orb2"></div>


<!-- =============================
