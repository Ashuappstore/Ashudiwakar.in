<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashu App Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #090d16, #161233, #064e47);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: #38bdf8;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }

        .hero {
            text-align: center;
            padding: 35px 20px 20px;
            max-width: 700px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .search-container {
            max-width: 500px;
            margin: 0 auto 25px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .app-card {
            border-radius: 20px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .app-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
        }

        .app-info-row {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 12px;
        }

        .app-icon {
            width: 65px;
            height: 65px;
            border-radius: 18px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(220, 39, 67, 0.35);
            flex-shrink: 0;
        }

        .app-details h3 {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .app-badge {
            display: inline-block;
            font-size: 11px;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .app-desc {
            font-size: 13.5px;
            color: #94a3b8;
            line-height: 1.45;
            margin-bottom: 15px;
        }

        .app-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12.5px;
            color: #cbd5e1;
            padding: 10px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 15px;
        }

        .direct-download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white;
            padding: 13px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
            width: 100%;
        }

        .direct-download-btn:hover {
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
            transform: scale(1.02);
        }

        .footer-box {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <header class="glass-panel">
        <a href="#" class="logo">
            <i class="fa-solid fa-cube"></i> Ashu App Store
        </a>
    </header>

    <div class="hero">
        <h1>प्रीमियम ऐप्स 1-Click में डाउनलोड करें</h1>
        <p>100% सुरक्षित और डायरेक्ट APK डाउनलोड्स</p>

        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="ऐप का नाम खोजें..." onkeyup="renderApps()">
        </div>
    </div>

    <div class="container">
        <div class="app-grid" id="appsContainer"></div>
    </div>

    <div class="footer-box">
        <p>© 2026 Ashu App Store • सभी APK सुरक्षित हैं</p>
    </div>

    <script>
        // ऐप्स डेटाबेस (भविष्य में नई ऐप्स यहाँ जोड़ें)
        const myApps = [
            {
                id: 1,
                title: "Instagram Lite",
                version: "v524.0.0.3.106",
                category: "Social",
                size: "3.5 MB",
                rating: "4.9",
                description: "कम इंटरनेट और कम स्टोरेज में तेज़ Instagram का मज़ा लें। रील्स, स्टोरीज़ और डायरेक्ट चैट सपोर्ट।",
                iconClass: "fa-brands fa-instagram",
                // डायरेक्ट लिंक यहाँ डालें:
                downloadUrl: "https://www.mediafire.com/file/st9y9z7zunxmm4d/com.instagram.lite-524.0.0.3.106.apk/file",
                fileName: "Instagram_Lite.apk"
            }
        ];

        function renderApps() {
            const container = document.getElementById('appsContainer');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = "";

            const filtered = myApps.filter(app => app.title.toLowerCase().includes(searchVal));

            if (filtered.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#94a3b8; padding:20px;">कोई ऐप नहीं मिली।</p>`;
                return;
            }

            filtered.forEach(app => {
                const card = document.createElement('div');
                card.className = "app-card glass-panel";
                card.innerHTML = `
                    <div class="app-info-row">
                        <div class="app-icon">
                            <i class="${app.iconClass}"></i>
                        </div>
                        <div class="app-details">
                            <h3>${app.title}</h3>
                            <span class="app-badge">${app.version} • ${app.category}</span>
                        </div>
                    </div>
                    <p class="app-desc">${app.description}</p>
                    <div class="app-meta">
                        <span><i class="fa-solid fa-hard-drive"></i> ${app.size}</span>
                        <span><i class="fa-solid fa-star" style="color:#f59e0b;"></i> ${app.rating}</span>
                    </div>
                    <button class="direct-download-btn" onclick="directDownload('${app.downloadUrl}', '${app.fileName}', this)">
                        <i class="fa-solid fa-cloud-arrow-down"></i> Download APK
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // 1-Click Pure Direct Download
        function directDownload(url, fileName, btn) {
            if (!url || url === "") {
                alert("⚠️ इस ऐप का डाउनलोड लिंक उपलब्ध नहीं है।");
                return;
            }

            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Downloading...';
            btn.style.background = '#059669';

            // सीधे फ़ाइल डाउनलोड शुरू करने का ट्रिगर
            const a = document.createElement('a');
            a.href = url;
            a.setAttribute('download', fileName);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => {
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Downloaded!';
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.style.background = '';
                }, 2000);
            }, 1500);
        }

        renderApps();
    </script>
</body>
</html>
