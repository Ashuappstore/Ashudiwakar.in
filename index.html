<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashu App Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --water-glow: rgba(56, 189, 248, 0.4);
            --water-border: rgba(255, 255, 255, 0.35);
            --water-bg: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 20%, #0d2b3a, #071724 60%, #020b12);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* लिक्विड ग्लास बेस पैनल */
        .glass-panel {
            background: rgba(15, 35, 55, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--water-border);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4),
                        inset 0 1px 1px rgba(255, 255, 255, 0.3);
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: #e0f2fe;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 0.5px;
        }

        /* लिक्विड ग्लास आइकन स्टाइल */
        .liquid-glass-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.35), rgba(56, 189, 248, 0.15) 50%, rgba(14, 165, 233, 0.25));
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: #e0f2fe;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.25),
                        inset 0 2px 5px rgba(255, 255, 255, 0.7),
                        inset 0 -3px 8px rgba(2, 132, 199, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .liquid-glass-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 45%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.05));
            border-radius: 18px 18px 50% 50%;
            pointer-events: none;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            font-size: 18px;
            border-radius: 12px;
        }

        .hero {
            text-align: center;
            padding: 40px 20px 20px;
            max-width: 700px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #7dd3fc, #38bdf8, #bae6fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .hero p {
            font-size: 14.5px;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .search-container {
            max-width: 500px;
            margin: 0 auto 30px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 52px;
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(15, 35, 55, 0.35);
            backdrop-filter: blur(15px);
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .search-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.35), inset 0 2px 4px rgba(0, 0, 0, 0.2);
            background: rgba(15, 35, 55, 0.5);
        }

        .search-input::placeholder {
            color: #64748b;
        }

        .search-icon-wrapper {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 14px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 22px;
        }

        .app-card {
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s;
        }

        .app-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 45px rgba(2, 132, 199, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.4);
        }

        .app-info-row {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 14px;
        }

        .app-icon {
            width: 68px;
            height: 68px;
            border-radius: 20px;
            font-size: 32px;
            flex-shrink: 0;
        }

        .app-details h3 {
            font-size: 19px;
            color: #f0f9ff;
            margin-bottom: 6px;
        }

        .app-badge {
            display: inline-block;
            font-size: 11.5px;
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(8px);
        }

        .app-desc {
            font-size: 13.5px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .app-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #bae6fd;
            padding: 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 16px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meta-icon {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            font-size: 11px;
        }

        .direct-download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.8), rgba(2, 132, 199, 0.85));
            color: #ffffff;
            padding: 14px;
            border-radius: 16px;
            font-size: 14.5px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.35),
                        inset 0 1px 2px rgba(255, 255, 255, 0.5);
            width: 100%;
            backdrop-filter: blur(10px);
        }

        .direct-download-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.5),
                        inset 0 2px 4px rgba(255, 255, 255, 0.7);
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.95), rgba(2, 132, 199, 1));
        }

        .footer-box {
            text-align: center;
            margin-top: 60px;
            padding: 20px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <header class="glass-panel">
        <a href="#" class="logo">
            <span class="liquid-glass-icon header-icon">
                <i class="fa-solid fa-droplet"></i>
            </span>
            Ashu App Store
        </a>
    </header>

    <div class="hero">
        <h1>प्रीमियम ऐप्स 1-Click में डाउनलोड करें</h1>
        <p>100% सुरक्षित, स्मूथ और डायरेक्ट APK डाउनलोड्स</p>

        <div class="search-container">
            <span class="liquid-glass-icon search-icon-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input type="text" id="searchInput" class="search-input" placeholder="ऐप का नाम खोजें..." onkeyup="renderApps()">
        </div>
    </div>

    <div class="container">
        <div class="app-grid" id="appsContainer"></div>
    </div>

    <div class="footer-box">
        <p>Copyright © 2026 Ashu App Store • All rights reserved.</p>
    </div>

    <script>
        // ऐप्स डेटाबेस (दोनों ऐप्स शामिल हैं)
        const myApps = [
            {
                id: 1,
                title: "Instagram Lite",
                version: "v524.0.0.3.106",
                category: "Social",
                size: "3.5 MB",
                rating: "4.9",
                description: "कम इंटरनेट और कम स्टोरेज में तेज़ Instagram का मज़ा लें। रील्स, स्टोरीज़ और डायरेक्ट चैट सपोर्ट।",
                iconClass: "fa-brands fa-instagram",
                downloadUrl: "https://www.mediafire.com/file/st9y9z7zunxmm4d/com.instagram.lite-524.0.0.3.106.apk/file",
                fileName: "Instagram_Lite.apk"
            },
            {
                id: 2,
                title: "UC Browser",
                version: "v13.5.8",
                category: "Browser",
                size: "45 MB",
                rating: "4.8",
                description: "सुपर फ़ास्ट डाउनलोडिंग, डेटा सेविंग और बेहतरीन ब्राउज़िंग स्पीड के साथ ऑल-इन-वन ब्राउज़र।",
                iconClass: "fa-solid fa-compass",
                // गूगल ड्राइव डायरेक्ट डाउनलोड फ़िक्स लिंक
                downloadUrl: "https://drive.google.com/uc?export=download&id=1Bx0p54XluZkujUUeNFyAfhrjoSJPw5-i",
                fileName: "UC_Browser.apk"
            }
        ];

        function renderApps() {
            const container = document.getElementById('appsContainer');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = "";

            const filtered = myApps.filter(app => app.title.toLowerCase().includes(searchVal));

            if (filtered.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#64748b; padding:20px;">कोई ऐप नहीं मिली।</p>`;
                return;
            }

            filtered.forEach(app => {
                const card = document.createElement('div');
                card.className = "app-card glass-panel";
                card.innerHTML = `
                    <div class="app-info-row">
                        <div class="liquid-glass-icon app-icon">
                            <i class="${app.iconClass}"></i>
                        </div>
                        <div class="app-details">
                            <h3>${app.title}</h3>
                            <span class="app-badge">${app.version} • ${app.category}</span>
                        </div>
                    </div>
                    <p class="app-desc">${app.description}</p>
                    <div class="app-meta">
                        <span class="meta-item">
                            <span class="liquid-glass-icon meta-icon">
                                <i class="fa-solid fa-hard-drive"></i>
                            </span>
                            ${app.size}
                        </span>
                        <span class="meta-item">
                            <span class="liquid-glass-icon meta-icon">
                                <i class="fa-solid fa-star" style="color:#38bdf8;"></i>
                            </span>
                            ${app.rating}
                        </span>
                    </div>
                    <button class="direct-download-btn" onclick="directDownload('${app.downloadUrl}', '${app.fileName}', this)">
                        <i class="fa-solid fa-cloud-arrow-down"></i> Download APK
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // 100% वर्किंग 1-Click डायरेक्ट डाउनलोड इंजन
        function directDownload(url, fileName, btn) {
            if (!url || url === "") {
                alert("⚠️ इस ऐप का डाउनलोड लिंक उपलब्ध नहीं है।");
                return;
            }

            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Downloading...';
            btn.style.background = 'linear-gradient(135deg, rgba(16, 185, 129, 0.8), rgba(5, 150, 105, 0.9))';

            // सीधे फ़ाइल डाउनलोड लिंक ट्रिगर करना
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', fileName);
            link.setAttribute('target', '_blank');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            setTimeout(() => {
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Started!';
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.style.background = '';
                }, 2500);
            }, 1000);
        }

        renderApps();
    </script>
</body>
</html>
